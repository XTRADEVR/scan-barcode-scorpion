<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SCORPION</title><script src="https://unpkg.com/html5-qrcode@2.3.10/html5-qrcode.min.js"></script><style>body{margin:0;background:#060a14;color:#fff;font-family:sans-serif;text-align:center}h2{padding:14px;background:#0a1628;border-bottom:2px solid #00ff88;margin:0}button{padding:14px 24px;background:#00ff88;color:#000;border:none;border-radius:10px;font-weight:800;margin:12px;font-size:16px}#reader{width:100%}#res{padding:14px;background:#0d1a33;margin:12px;border-radius:12px;text-align:left}</style></head><body><h2>🦂 SCORPION SCAN</h2><button id="btn" onclick="mulai()">📷 MULAI SCAN</button><div id="reader"></div><div id="res">Klik MULAI SCAN dulu KING!</div><script>function mulai(){document.getElementById('btn').style.display='none';const r=document.getElementById('res');const q=new Html5Qrcode("reader");q.start({facingMode:"environment"},{fps:10,qrbox:250},t=>{r.innerHTML='<b style=color:#00ff88;font-size:22px>'+t+'</b><br><button onclick=navigator.clipboard.writeText(\''+t+'\') style=margin-top:8px;padding:8px;background:#fff> COPY</button>';navigator.vibrate&&navigator.vibrate(200)},err=>{}).catch(e=>r.innerText=e)} </script></body></html>
